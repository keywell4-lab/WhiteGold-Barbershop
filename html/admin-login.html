
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | White Gold Barbershop</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #101010;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            background: #191919;
            border: 1px solid #493e20;
            border-radius: 12px;
        }
        h1 { margin-top: 0; }
        h1 span { color: #d4af37; }
        p { color: #aaa; }
        label { display: block; margin: 18px 0 7px; }
        input {
            width: 100%;
            padding: 12px;
            color: white;
            background: #101010;
            border: 1px solid #444;
            border-radius: 6px;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 6px;
            background: #d4af37;
            color: #111;
            font-weight: bold;
            cursor: pointer;
        }
        #message { overflow-wrap: anywhere; }
        a { color: #f0d675; }
        .password-wrapper {
    position: relative;
}

.password-wrapper input {
    width: 100%;
    padding-right: 45px;
}

.eye-icon {
    position: absolute;
    right: 13px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    display: flex;
    align-items: center;
    color: #d4af37;
}

.eye-icon svg {
    width: 21px;
    height: 21px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}
    </style>
</head>
<body>
    <main class="login-box">
        <h1>WHITE <span>GOLD</span></h1>
        <h2>Admin Login</h2>
        <p>Sign in to manage barbershop bookings.</p>

        <form id="loginForm">
            <label for="email">Admin email</label>
            <input id="email" type="email" autocomplete="username" required>

          <label for="password">Password</label>

<div class="password-wrapper">
    <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
    >

    <span id="togglePassword" class="eye-icon" title="Show password">
        <svg id="eyeOpen" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
            <circle cx="12" cy="12" r="3"/>
        </svg>

        <svg id="eyeClosed" viewBox="0 0 24 24"
             aria-hidden="true" style="display:none">
            <path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
            <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a16 16 0 0 1-4 4.8M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7c1.4 0 2.7-.3 3.8-.8"/>
        </svg>
    </span>
</div>

            <button type="submit">Sign In</button>
        </form>

        <p id="message" role="status"></p>
        <a href="index.html">Back to website</a>
    </main>

    <script type="module" src="../js/admin-login.js"></script>
</body>
</html>
